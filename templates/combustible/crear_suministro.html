{% extends 'base.html' %}

{% block content %}
<style>
body { background: linear-gradient(135deg, #bcc7ff, #ddbeff); }
</style>

<div class="row justify-content-center mt-4">
    <div class="col-md-7">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header text-white text-center" style="background: linear-gradient(135deg, #0d6efd, #6f42c1);">
                <h4 class="mb-0 py-2 fw-bold">
                    <i class="bi bi-plus-circle"></i> Suministrar Combustible al Depósito
                </h4>
            </div>
            <div class="card-body p-4 bg-light">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_nombre" class="form-label fw-bold text-secondary">{{ form.nombre.label }}</label>
                        <input type="text" name="nombre" id="id_nombre" class="form-control" value="{{ form.nombre.value|default:'' }}" placeholder="Opcional: nombre del suministro">
                    </div>
                    <div class="mb-3">
                        <label for="id_fecha_hora" class="form-label fw-bold text-secondary">{{ form.fecha_hora.label }} *</label>
                        <input type="datetime-local" name="fecha_hora" id="id_fecha_hora" class="form-control" value="{{ form.fecha_hora.value|date:'Y-m-d\TH:i'|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_tipo_combustible" class="form-label fw-bold text-secondary">{{ form.tipo_combustible.label }} *</label>
                        {{ form.tipo_combustible }}
                    </div>
                    <div class="mb-3">
                        <label for="id_cantidad" class="form-label fw-bold text-secondary">{{ form.cantidad.label }} *</label>
                        <input type="number" name="cantidad" id="id_cantidad" class="form-control" placeholder="0.00" step="0.01" min="0.01" value="{{ form.cantidad.value|default:'' }}">
                    </div>
                    <div class="mb-4">
                        <label for="id_descripcion" class="form-label fw-bold text-secondary">{{ form.descripcion.label }}</label>
                        {{ form.descripcion }}
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'lista_suministros' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Volver
                        </a>
                        <button type="submit" class="btn btn-success fw-bold">
                            <i class="bi bi-check-circle"></i> Guardar Suministro
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var fechaHora = document.getElementById('id_fecha_hora');
    if (!fechaHora.value) {
        var now = new Date();
        var fecha = now.getFullYear() + '-' +
            String(now.getMonth() + 1).padStart(2, '0') + '-' +
            String(now.getDate()).padStart(2, '0') + 'T' +
            String(now.getHours()).padStart(2, '0') + ':' +
            String(now.getMinutes()).padStart(2, '0');
        fechaHora.value = fecha;
    }
});
</script>
{% endblock %}
