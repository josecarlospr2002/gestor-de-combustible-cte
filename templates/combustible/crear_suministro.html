{% extends 'base.html' %}

{% block content %}
<style>
body { background: linear-gradient(135deg, #bcc7ff, #ddbeff); }
</style>

<div class="row justify-content-center mt-4">
    <div class="col-md-7">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header text-white text-center" style="background: linear-gradient(135deg, #0d6efd, #6f42c1);">
                <h4 class="mb-0 py-2 fw-bold">
                    <i class="bi bi-plus-circle"></i> Suministrar Combustible al Depósito
                </h4>
            </div>
            <div class="card-body p-4 bg-light">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_nombre" class="form-label fw-bold text-secondary">{{ form.nombre.label }}</label>
                        {{ form.nombre }}
                    </div>
                    <div class="mb-3">
                        <label for="id_fecha_hora" class="form-label fw-bold text-secondary">{{ form.fecha_hora.label }} *</label>
                        {{ form.fecha_hora }}
                    </div>
                    <div class="mb-3">
                        <label for="id_tipo_combustible" class="form-label fw-bold text-secondary">{{ form.tipo_combustible.label }} *</label>
                        {{ form.tipo_combustible }}
                    </div>
                    <div class="mb-3">
                        <label for="id_cantidad" class="form-label fw-bold text-secondary">{{ form.cantidad.label }} *</label>
                        {{ form.cantidad }}
                    </div>
                    <div class="mb-4">
                        <label for="id_descripcion" class="form-label fw-bold text-secondary">{{ form.descripcion.label }}</label>
                        {{ form.descripcion }}
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'lista_suministros' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Volver
                        </a>
                        <button type="submit" class="btn btn-success fw-bold">
                            <i class="bi bi-check-circle"></i> Guardar Suministro
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
