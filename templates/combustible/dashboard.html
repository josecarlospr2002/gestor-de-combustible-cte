{% extends 'base.html' %}

{% block content %}
<style>
body { background: linear-gradient(135deg, #bcc7ff, #ddbeff); }
</style>

<h1 class="mb-2">Inventario de Combustible</h1>
<p class="text-muted mb-4">Esta pantalla es visible para todos los roles.</p>

<div class="row mt-2">
    <div class="col-md-4">
        <div class="card border-primary mb-3">
            <div class="card-header bg-primary text-white">
                <i class="bi bi-droplet-fill"></i> Combustible Existente
            </div>
            <div class="card-body text-center">
                <h3 class="card-title text-primary">0 L</h3>
                <p class="card-text text-muted">Litros registrados</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card border-success mb-3">
            <div class="card-header bg-success text-white">
                <i class="bi bi-check-circle-fill"></i> Combustible Real
            </div>
            <div class="card-body text-center">
                <h3 class="card-title text-success">0 L</h3>
                <p class="card-text text-muted">Litros disponibles</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card border-purple mb-3" style="border-color: #6f42c1 !important;">
            <div class="card-header text-white" style="background-color: #7c5cbf !important;">
                <i class="bi bi-box-seam-fill"></i> Combustible en Almacén
            </div>
            <div class="card-body text-center">
                <h3 class="card-title" style="color: #6f42c1 !important;">0 L</h3>
                <p class="card-text text-muted">Litros restantes</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
