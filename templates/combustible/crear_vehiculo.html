{% extends 'base.html' %}

{% block content %}
<style>
body { background: linear-gradient(135deg, #bcc7ff, #ddbeff); }
</style>

<div class="row justify-content-center mt-4">
    <div class="col-md-7">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header text-white text-center" style="background: linear-gradient(135deg, #0d6efd, #6f42c1);">
                <h4 class="mb-0 py-2 fw-bold">
                    <i class="bi bi-plus-circle"></i> Añadir Vehículo
                </h4>
            </div>
            <div class="card-body p-4 bg-light">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_tipo_combustible" class="form-label fw-bold text-secondary">{{ form.tipo_combustible.label }}</label>
                        {{ form.tipo_combustible }}
                    </div>
                    <div class="mb-3">
                        <label for="id_empresa" class="form-label fw-bold text-secondary">{{ form.empresa.label }}</label>
                        {{ form.empresa }}
                    </div>
                    <div class="mb-3">
                        <label for="id_tipo_vehiculo" class="form-label fw-bold text-secondary">{{ form.tipo_vehiculo.label }}</label>
                        {{ form.tipo_vehiculo }}
                    </div>
                    <div class="mb-3">
                        <label for="id_chapa" class="form-label fw-bold text-secondary">{{ form.chapa.label }}</label>
                        {{ form.chapa }}
                    </div>
                    <div class="mb-4">
                        <label for="id_actividad" class="form-label fw-bold text-secondary">{{ form.actividad.label }}</label>
                        {{ form.actividad }}
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'lista_transporte' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Volver
                        </a>
                        <button type="submit" class="btn btn-success fw-bold">
                            <i class="bi bi-check-circle"></i> Guardar Vehículo
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
