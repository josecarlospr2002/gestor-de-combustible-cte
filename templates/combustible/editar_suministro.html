{% extends 'base.html' %}

{% block content %}
    <style>
        body {
            background: linear-gradient(135deg, #bcc7ff, #ddbeff);
        }
    </style>

    <div class="row justify-content-center mt-4">
        <div class="col-md-7">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header text-white text-center"
                     style="background: linear-gradient(135deg, #0d6efd, #6f42c1);">
                    <h4 class="mb-0 py-2 fw-bold">
                        <i class="bi bi-pencil-square"></i> Modificar Suministro
                    </h4>
                </div>
                <div class="card-body p-4 bg-light">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-bold text-secondary">Nombre del Suministro</label>
                            <input type="text" name="nombre" id="nombre" class="form-control"
                                   value="{{ suministro.nombre }}" placeholder="Opcional: nombre del suministro">
                        </div>
                        <div class="mb-3">
                            <label for="fecha_hora" class="form-label fw-bold text-secondary">Fecha y Hora *</label>
                            <input type="datetime-local" name="fecha_hora" id="fecha_hora" class="form-control"
                                   value="{{ suministro.fecha_hora|date:'Y-m-d\TH:i' }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="tipo_combustible" class="form-label fw-bold text-secondary">Tipo de Combustible
                                *</label>
                            <input type="text" name="tipo_combustible" id="tipo_combustible" class="form-control"
                                   value="{{ suministro.tipo_combustible }}"
                                   placeholder="Ej: Gasolina, Diésel, Petróleo..." required>
                        </div>
                        <div class="mb-3">
                            <label for="cantidad" class="form-label fw-bold text-secondary">Cantidad de Combustible
                                *</label>
                            <input type="number" name="cantidad" id="cantidad" class="form-control" placeholder="0.00"
                                   step="0.01" min="0.01" value="{{ suministro.cantidad|stringformat:'.2f' }}" required>
                            <div class="mb-4">
                                <label for="descripcion" class="form-label fw-bold text-secondary">Descripción /
                                    Nota</label>
                                <textarea name="descripcion" id="descripcion" class="form-control"
                                          placeholder="Opcional: nota, recuerdo u observación"
                                          rows="3">{{ suministro.descripcion|default:'' }}</textarea>
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="{% url 'lista_suministros' %}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Volver
                                </a>
                                <button type="submit" class="btn text-white fw-bold"
                                        style="background: linear-gradient(135deg, #0d6efd, #6f42c1); border: none;">
                                    <i class="bi bi-check-circle"></i> Guardar Cambios
                                </button>
                            </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
